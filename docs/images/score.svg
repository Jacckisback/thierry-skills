<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 580" width="1600" height="580" role="img" aria-label="The 100-point review grid: nine weighted axes, 85 needed to ship"><title>The 100-point review grid: nine weighted axes, 85 needed to ship</title><rect width="1600" height="580" fill="#f4f5f7"/><text x="80" y="70" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#14161a" text-anchor="start" letter-spacing="2.2" >THE 100-POINT REVIEW</text><line x1="80" y1="92" x2="1520" y2="92" stroke="#14161a" stroke-width="1.5"/><text x="80" y="157" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#14161a" text-anchor="start" letter-spacing="0" >Idea and personality</text><rect x="470" y="137" width="720" height="26" fill="#e5412d"/><text x="1206" y="158" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#14161a" text-anchor="start" letter-spacing="0" >20</text><text x="80" y="203" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#14161a" text-anchor="start" letter-spacing="0" >Typography</text><rect x="470" y="183" width="540" height="26" fill="#14161a"/><text x="1026" y="204" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#14161a" text-anchor="start" letter-spacing="0" >15</text><text x="80" y="249" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#14161a" text-anchor="start" letter-spacing="0" >Composition</text><rect x="470" y="229" width="540" height="26" fill="#14161a"/><text x="1026" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#14161a" text-anchor="start" letter-spacing="0" >15</text><text x="80" y="295" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#14161a" text-anchor="start" letter-spacing="0" >Colour and shape</text><rect x="470" y="275" width="360" height="26" fill="#14161a"/><text x="846" y="296" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#14161a" text-anchor="start" letter-spacing="0" >10</text><text x="80" y="341" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#14161a" text-anchor="start" letter-spacing="0" >Content and voice</text><rect x="470" y="321" width="360" height="26" fill="#14161a"/><text x="846" y="342" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#14161a" text-anchor="start" letter-spacing="0" >10</text><text x="80" y="387" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#14161a" text-anchor="start" letter-spacing="0" >Finish</text><rect x="470" y="367" width="360" height="26" fill="#14161a"/><text x="846" y="388" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#14161a" text-anchor="start" letter-spacing="0" >10</text><text x="80" y="433" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#14161a" text-anchor="start" letter-spacing="0" >Accessibility and performance</text><rect x="470" y="413" width="360" height="26" fill="#14161a"/><text x="846" y="434" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#14161a" text-anchor="start" letter-spacing="0" >10</text><text x="80" y="479" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#14161a" text-anchor="start" letter-spacing="0" >Image</text><rect x="470" y="459" width="180" height="26" fill="#14161a"/><text x="666" y="480" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#14161a" text-anchor="start" letter-spacing="0" >5</text><text x="80" y="525" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#14161a" text-anchor="start" letter-spacing="0" >Motion</text><rect x="470" y="505" width="180" height="26" fill="#14161a"/><text x="666" y="526" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#14161a" text-anchor="start" letter-spacing="0" >5</text><line x1="1240" y1="130" x2="1240" y2="540" stroke="#c9cdd4" stroke-width="1.5"/><text x="1280" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="120" font-weight="400" fill="#e5412d" text-anchor="start" letter-spacing="-3" >85</text><text x="1280" y="240" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#5c6370" text-anchor="start" letter-spacing="1.6" >TO SHIP</text><text x="1280" y="290" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5c6370" text-anchor="start" letter-spacing="0" >Below that, the three</text><text x="1280" y="317" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5c6370" text-anchor="start" letter-spacing="0" >heaviest weaknesses get</text><text x="1280" y="344" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5c6370" text-anchor="start" letter-spacing="0" >fixed and the page is</text><text x="1280" y="371" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5c6370" text-anchor="start" letter-spacing="0" >captured again.</text><text x="1280" y="424" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5c6370" text-anchor="start" letter-spacing="0" >Capped at 70 with no</text><text x="1280" y="451" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5c6370" text-anchor="start" letter-spacing="0" >identifiable idea, at 60</text><text x="1280" y="478" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5c6370" text-anchor="start" letter-spacing="0" >when body text fails</text><text x="1280" y="505" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5c6370" text-anchor="start" letter-spacing="0" >contrast.</text></svg>

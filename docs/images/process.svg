 Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5c6370" text-anchor="start" letter-spacing="0" >sequence, section</text><text x="902.8571428571429" y="364" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5c6370" text-anchor="start" letter-spacing="0" >by section.</text><text x="1108.5714285714287" y="208" font-family="Georgia, 'Times New Roman', serif" font-size="110" font-weight="400" fill="#14161a" text-anchor="start" letter-spacing="-3" >6</text><line x1="1108.5714285714287" y1="236" x2="1286.2857142857144" y2="236" stroke="#14161a" stroke-width="1.5"/><text x="1108.5714285714287" y="278" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#14161a" text-anchor="start" letter-spacing="0" >Execute</text><text x="1108.5714285714287" y="312" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5c6370" text-anchor="start" letter-spacing="0" >Every state,</text><text x="1108.5714285714287" y="338" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5c6370" text-anchor="start" letter-spacing="0" >real copy, mobile</text><text x="1108.5714285714287" y="364" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5c6370" text-anchor="start" letter-spacing="0" >and desktop.</text><text x="1314.2857142857142" y="208" font-family="Georgia, 'Times New Roman', serif" font-size="110" font-weight="400" fill="#e5412d" text-anchor="start" letter-spacing="-3" >7</text><line x1="1314.2857142857142" y1="236" x2="1492.0" y2="236" stroke="#e5412d" stroke-width="2.5"/><text x="1314.2857142857142" y="278" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#14161a" text-anchor="start" letter-spacing="0" >Look and score</text><